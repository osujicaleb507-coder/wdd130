<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Format</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>✅ Basic HTML Quiz and CSS Quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">How are id and attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">Which of the following is a valid CSS?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">A. &lt; Caleb Anthony &gt;</option>
                    <option value="b">B. Osuji Anthony</option>
                    <option value="c">C. Ogochukwu Caleb</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">What is the bottom value given this expression? /label>
                    <code class="box"> margn: 10px 5px 15px;</code>
                    <input type="text" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
